<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JohnnyStudio</title>
  <!-- TODO(vision): 철학이 정해지면 소개 문구로 바꾼다 -->
  <meta name="description" content="JohnnyStudio 포털: 스튜디오 소개와 프로젝트 모음 (준비 중)">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">JohnnyStudio</a>
      <nav aria-label="주 메뉴">
        <ul class="nav">
          <li><a href="/#projects">Projects</a></li>
          <li><a href="/#about">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="container">
        <p class="eyebrow">JohnnyStudio</p>
        <!-- TODO(vision): PHILOSOPHY.md §1 한 문장 정의 -->
        <h1 id="hero-title" class="hero__title">한 문장 정의가 들어갈 자리</h1>
        <!-- TODO(vision): 미션·비전 요약 -->
        <p class="hero__lead">스튜디오의 철학을 요약한 소개 문구가 들어갈 자리입니다.</p>
      </div>
    </section>

    <section id="projects" class="section" aria-labelledby="projects-title">
      <div class="container">
        <h2 id="projects-title" class="section__title">Projects</h2>
        <ul class="card-grid">
          <li>
            <article class="card">
              <h3 class="card__title"><a href="https://arkurator.net" rel="noopener">Arkurator</a></h3>
              <p class="card__desc">파일 기반 지식 관리와 RAG AI 에이전트를 결합한 지능형 아카이빙 플랫폼.</p>
              <p class="card__meta"><span class="badge badge--live">운영 중</span></p>
            </article>
          </li>
          <li>
            <article class="card card--placeholder">
              <h3 class="card__title">다음 프로젝트</h3>
              <!-- TODO(vision): PHILOSOPHY.md §5 앞으로의 영역 -->
              <p class="card__desc">준비 중입니다.</p>
            </article>
          </li>
        </ul>
      </div>
    </section>

    <section id="about" class="section section--alt" aria-labelledby="about-title">
      <div class="container">
        <h2 id="about-title" class="section__title">About</h2>
        <!-- TODO(vision): PHILOSOPHY.md 확정 후 작성 -->
        <p class="prose">JohnnyStudio의 철학과 이야기가 들어갈 자리입니다.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span data-year>2026</span> JohnnyStudio</p>
    </div>
  </footer>
</body>
</html>
