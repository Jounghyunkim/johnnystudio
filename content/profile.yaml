# 외부 채널 (GitHub, YouTube, 블로그 등). 예: - { label: GitHub, href: https://github.com/<계정> }
links: []

# 홈(랜딩) 페이지 문구 (web/src/app/page.tsx). 답변은 지금 실제로 동작하는 것만 쓴다
landing:
  eyebrow: Self-hosted creative studio
  steps:
    - title: 둘러보기
      text: Library에서 이름·설명·태그로 찾고, 유형별로 골라 봅니다.
      href: /library/
      action: Library 열기
    - title: 바로 쓰기
      text: 웹 서비스는 바로 실행하고, 프로그램은 체크섬을 확인한 뒤 내려받습니다.
      href: /library/?type=web-app
      action: 웹 서비스 보기
    - title: 모아 두기
      text: 카드의 ☆를 누르면 My Studio에 모입니다. 로그인하지 않아도 됩니다.
      href: /studio/
      action: My Studio
    - title: 함께 일하기
      text: 요청부터 검수, 납품까지 한곳에 기록하며 진행합니다.
      href: /work/
      action: Work with me
  faq:
    - q: 로그인해야 쓸 수 있나요?
      a: 아니요. 공개된 작품은 로그인 없이 보고, 실행하고, 내려받을 수 있습니다. 즐겨찾기도 로그인 없이 이 브라우저에 저장됩니다.
    - q: 내려받은 파일이 바뀌지 않았는지 어떻게 아나요?
      a: 다운로드마다 SHA-256 체크섬과 확인하는 명령을 함께 공개합니다. 내려받은 파일의 체크섬이 같으면 올린 그대로입니다.
    - q: 방문 기록을 추적하나요?
      a: 아니요. 추적 쿠키와 분석 스크립트를 쓰지 않습니다. 쿠키는 로그인했을 때 로그인 유지에만 씁니다.
    - q: 가입하면 어떤 정보를 저장하나요?
      a: 이메일 주소와 비밀번호뿐입니다. 비밀번호는 되돌릴 수 없게 변환한 값만 저장해서 운영자도 알 수 없습니다.
      link:
        label: 개인정보처리방침
        href: /privacy/
    - q: 어디에서 운영하나요?
      a: 집에 있는 홈랩 서버에서 직접 운영합니다. 콘텐츠 원본은 파일로 두어 언제든 옮길 수 있습니다.
      link:
        label: 운영 방식
        href: /about/
    - q: 일을 맡기려면 어떻게 하나요?
      a: Work with me에서 제공하는 일과 진행 방식을 볼 수 있습니다. 의뢰인과 결과물을 주고받는 전용 공간(Client Room)은 준비 중입니다.
      link:
        label: Work with me
        href: /work/
  closing:
    title: 만든 것을 바로 써 보세요
    text: 공개된 작품은 가입 없이 바로 실행하고 내려받을 수 있습니다.
