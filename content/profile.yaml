# JohnnyStudio 프로필: 홈·About·Work with me 에 보이는 문구의 원본
# 출처: docs/ideation.md v2, docs/01_vision/PHILOSOPHY.md (초안 v1, 사용자 확인 전)
# 형식: web/src/lib/schema.ts 의 Profile

name: JohnnyStudio
tagline: 만든 것을 한곳에, 바로 쓸 수 있게.
intro: >-
  JohnnyStudio는 소프트웨어·영상·사진·글·하드웨어 작업을 한곳에 모은 셀프 호스팅 스튜디오입니다.
  둘러보고, 바로 실행하거나 내려받고, 필요하면 함께 일하세요.

principles:
  - title: Digital Twin & Life Log
    titleKo: 디지털 자아와 삶의 기록
    summary: 과거의 흔적부터 지금의 프로젝트까지, 모든 작업을 언제·왜 만들었는지와 함께 기록합니다.
  - title: Sovereignty & Self-Hosting
    titleKo: 데이터 주권과 독립성
    summary: 집에 있는 홈랩 서버에서 직접 운영합니다. 콘텐츠 원본은 파일로 두어 언제든 옮길 수 있습니다.
  - title: User-Centric Accessibility
    titleKo: 무마찰 접근과 개인화
    summary: 공개 자료는 로그인 없이 바로 쓸 수 있습니다. 즐겨찾기로 나만의 화면을 만드세요.
  - title: Seamless Collaboration
    titleKo: 끊김 없는 협업
    summary: 요청부터 검수, 납품까지 한곳에 이력으로 남기며 의뢰인과 명확하게 소통합니다.
  - title: Trust by Design
    titleKo: 신뢰가 기본
    summary: 다운로드 파일의 체크섬과 변경 내역을 공개하고, 방문자를 추적하지 않습니다.

