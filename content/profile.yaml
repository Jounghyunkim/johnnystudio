    related: [arkurator]
  - title: 웹 서비스 개발
    summary: 프론트엔드부터 백엔드, 배포까지 한 사람이 책임지고 만듭니다.
    related: [arkurator]
  - title: 데스크톱 도구 개발
    summary: 반복 업무를 줄이는 Windows 데스크톱 도구를 만듭니다.
    related: []
  - title: 홈랩·셀프 호스팅 구축
    summary: 미니 PC 한 대로 서비스를 직접 운영하는 환경을 설계하고 구축합니다.
    related: []

# 의뢰 진행 방식: GitHub 개념에 대응시킨다 (ideation §3-4)
process:
  - title: 요청
    github: Issue
    summary: 필요한 것을 이야기해 주세요. 요청 하나가 하나의 이슈로 기록됩니다.
  - title: 작업
    github: In progress
    summary: 진행 상황과 중간 결과를 같은 자리에서 공유합니다.
  - title: 검수
    github: Pull Request 리뷰
    summary: 결과물 버전을 올리면 승인하거나 수정을 요청할 수 있습니다.
  - title: 납품
    github: Release
    summary: 승인된 버전을 최종본으로 고정해 전달합니다.

