# JohnnyStudio 포털: nginx 사이트 설정 템플릿
#
# 설치 방법은 deploy/README.md §2 를 따른다. __DOMAIN__ 을 실제 도메인으로 바꿔서 쓴다.
# HTTPS(443)와 HTTP→HTTPS 리다이렉트는 certbot --nginx 가 서버의 사이트 파일에 추가한다.
#
# 같은 nginx 의 arkurator-backend(johnnyhouse.iptime.org)와는 server_name 으로 구분된다.
# 그 사이트 파일은 건드리지 않는다.

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root  /opt/johnnystudio/current;   # deploy.sh 가 바꾸는 심볼릭 링크
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/johnnystudio.access.log;
    error_log  /var/log/nginx/johnnystudio.error.log;

    # 보안 헤더
    # 주의: location 안에 add_header 를 하나라도 쓰면 여기 헤더가 그 location 에 상속되지 않는다.
    #       그래서 캐시는 add_header 대신 expires 로만 조절한다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    error_page 404 /404.html;

    # 숨김 파일(.release 등)은 내주지 않는다. 인증서 발급용 /.well-known/ 만 예외
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # CSS·JS: 파일명에 해시가 없어서 짧게 캐시한다
    location ~* \.(?:css|js)$ {
        expires 1h;
    }

    # 이미지·폰트: 거의 바뀌지 않는다. 바꿀 때는 파일명을 바꾼다
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # HTML: 매번 재검증해서 배포가 바로 보이게 한다
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
