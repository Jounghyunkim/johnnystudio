# JohnnyStudio 포털: nginx 사이트 설정 템플릿
#
# 설치 방법은 deploy/README.md §2 를 따른다. __DOMAIN__ 을 실제 도메인으로 바꿔서 쓴다.
#
# 공개 경로 (ADR-0006):
#   방문자 ─HTTPS─▶ Cloudflare ─Tunnel─▶ cloudflared (M8) ─HTTP─▶ 127.0.0.1:8081 (이 서버 블록)
#
# - 이 사이트는 127.0.0.1 에서만 듣는다. 공유기 포트포워딩(80/443)과 무관하고, 같은 nginx 의
#   arkurator-backend(johnnyhouse.iptime.org, 80/443)와 포트부터 다르다. 그 사이트 파일은 건드리지 않는다.
# - HTTPS 와 HTTP→HTTPS 리다이렉트는 Cloudflare 가 처리한다.
# - /api/ 는 회원 API(FastAPI, 127.0.0.1:8082)로 넘긴다 (ADR-0007). 나머지는 정적 파일이다.

# 회원 API 요청 제한: 방문자 IP 당 분당 30회 (앱도 로그인 링크 요청을 따로 제한한다)
limit_req_zone $binary_remote_addr zone=johnnystudio_api:1m rate=30r/m;

server {
    listen 127.0.0.1:8081;
    server_name __DOMAIN__ www.__DOMAIN__;

    root  /opt/johnnystudio/current;   # deploy.sh 가 바꾸는 심볼릭 링크
    index index.html;
    charset utf-8;

    # /library/x → /library/x/ 같은 리다이렉트를 상대 경로로 보낸다.
    # 켜 두면 nginx 가 자기 주소(http://도메인:8081/…)를 Location 에 넣어서, 터널 뒤에서는 방문자가 엉뚱한 곳으로 간다.
    absolute_redirect off;

    # 로그에 방문자 실제 IP 를 남긴다 (cloudflared 가 같은 기기에서 넘겨준다)
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/johnnystudio.access.log;
    error_log  /var/log/nginx/johnnystudio.error.log;

    # ── 보안 헤더 ──
    # 주의: location 안에 add_header 를 하나라도 쓰면 여기 헤더가 그 location 에 상속되지 않는다.
    #       그래서 캐시는 add_header 대신 expires 로만 조절한다.
    #
    # CSP (ADR-0004, ADR-0007):
    #   script-src 'unsafe-inline'  Next.js 정적 내보내기가 페이지마다 인라인 <script>(RSC 데이터)를 넣는다.
    #                               이 헤더는 넓게 열어 두고, 페이지마다 들어 있는 CSP <meta> 가 그 페이지의 인라인 스크립트
    #                               SHA-256 해시만 허용한다 (web/scripts/inject-csp.mjs). 브라우저는 두 정책을 모두 지키므로
    #                               실제로는 해시가 맞는 스크립트만 실행된다. scripts/check_site.py 가 모든 페이지를 검사한다.
    #   style-src 'self'            인라인 스타일은 쓰지 않는다 (scripts/check.sh 가 검사).
    #   img-src i.ytimg.com         YouTube 썸네일 (클릭 전 라이트 임베드)
    #   frame-src youtube-nocookie  클릭 후 영상 재생. 웹 패키지 샌드박스 도메인이 생기면 여기에 추가한다 (Phase 1.5)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data: https://i.ytimg.com; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain text/x-component;

    error_page 404 /404.html;

    # 숨김 파일(.release 등)은 내주지 않는다. 인증서 발급용 /.well-known/ 만 예외
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # 다운로드 파일 (exe·zip·사진): 릴리스와 따로, 배포해도 바뀌지 않는 폴더 (ADR-0005)
    location /files/ {
        alias /opt/johnnystudio/files/;
        autoindex off;
        expires 7d;
        access_log /var/log/nginx/johnnystudio.files.log;  # 다운로드 수 집계용 (쿠키 없는 분석)
    }

    # Next.js 빌드 산출물: 파일명에 해시가 있어서 내용이 바뀌면 이름도 바뀐다 → 오래 캐시
    location /_next/static/ {
        expires max;
        access_log off;
    }

    # 그 밖의 이미지·폰트: 거의 바뀌지 않는다. 바꿀 때는 파일명을 바꾼다
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # ── 회원 API (ADR-0007) ──
    # ^~ : 아래 정규식 location(이미지 확장자)보다 먼저 고른다
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 방문자 IP. real_ip 설정이 Cloudflare 가 알려 준 IP 로 바꿔 둔 값이다.
        # X-Forwarded-For 도 덮어쓴다: 방문자가 보낸 값을 그대로 넘기면 IP 를 속여 요청 제한을 피할 수 있다
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        limit_req zone=johnnystudio_api burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/johnnystudio.api.log;
    }

    # HTML·RSC 데이터(.txt): 매번 재검증해서 배포가 바로 보이게 한다
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }
}
