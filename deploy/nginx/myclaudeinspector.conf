# My Claude Inspector (~/workspace/myclaudeinspector) 를 M8 에서 인터넷에 공개하는 nginx 사이트 템플릿
#
# 설치 방법: deploy/README.md §9. __HOST__ 를 실제 주소(예: inspector.johnnystudio.net)로 바꿔서 쓴다.
#
#   방문자 ─HTTPS─▶ 이 서버 블록 (certbot 이 443 을 더한다) ─▶ 127.0.0.1:3300 (screen 세션 MyClaudeInspector, next start)
#
# 이 앱의 대시보드(/), 트렌드(/trends), 자세히 보기(/learn/…)는 주소에 적힌 "서버 PC 의 폴더"를 읽는다.
# M8 에서 그대로 열면 방문자가 운영자의 Claude 설정·CLAUDE.md·세션·토큰 사용량을 볼 수 있으므로,
# 랭킹·다운로드·로그인 화면과 랭킹 API 만 넘기고 나머지는 모두 404 로 막는다 (2026-11-24 사용자 결정).
# 앱 자체도 127.0.0.1 에서만 듣는다. 이 nginx 를 거치지 않고는 바깥에서 닿지 않는다.

server {
    listen 80;
    server_name __HOST__;

    access_log /var/log/nginx/myclaudeinspector.access.log;
    error_log  /var/log/nginx/myclaudeinspector.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;

    # 첫 화면(대시보드)은 열지 않는다. 랭킹으로 보낸다
    location = / {
        return 302 /ranking;
    }

    # 여는 화면: 랭킹, 다운로드, 로그인·가입, 랭킹 설정(전송 토큰). 쿼리(?_rsc= 등)는 그대로 넘어간다
    location ~ ^/(ranking|download|settings|auth/login|auth/sign-up)/?$ {
        proxy_pass http://127.0.0.1:3300;
    }

    # 랭킹 API (PC 앱이 기록을 올리고 순위를 읽는다)
    location ^~ /api/ranking/ {
        proxy_pass http://127.0.0.1:3300;
    }

    # 빌드 산출물 (파일 이름에 해시가 있다)
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3300;
        expires max;
    }

    # public/ 의 그림과 파비콘
    location ~ ^/(favicon\.ico|[a-z0-9-]+\.svg)$ {
        proxy_pass http://127.0.0.1:3300;
    }

    # 그 밖(/trends, /learn/…, /app-settings, /api/desktop/… 등)은 열지 않는다
    location / {
        return 404;
    }
}
